{% load static %}

<header class="pc-header">
  <div class="header-wrapper">
    <!-- [Mobile Media Block] start -->
    <div class="me-auto pc-mob-drp">
      <ul class="list-unstyled">
        <!-- ======= Menu collapse Icon ===== -->
        <li class="pc-h-item pc-sidebar-collapse">
          <a href="#" class="pc-head-link ms-0" id="sidebar-hide">
            <i>
              <svg class="pc-icon">
                <use xlink:href="#menu"></use>
              </svg>
            </i>
          </a>
        </li>
        <li class="pc-h-item pc-sidebar-popup">
          <a href="#" class="pc-head-link ms-0" id="mobile-collapse">
            <i>
              <svg class="pc-icon">
                <use xlink:href="#menu"></use>
              </svg>
            </i>
          </a>
        </li>
        <li class="dropdown pc-h-item d-inline-flex d-md-none">
          <a class="pc-head-link dropdown-toggle arrow-none m-0"
             data-bs-toggle="dropdown"
             href="#"
             role="button"
             aria-haspopup="false"
             aria-expanded="false">
            <i>
              <svg class="pc-icon">
                <use xlink:href="#search"></use>
              </svg>
            </i>
          </a>
          <div class="dropdown-menu pc-h-dropdown drp-search">
            <form class="px-3">
              <div class="mb-0 d-flex align-items-center">
                <i data-feather="search"></i>
                <input type="search"
                       class="form-control border-0 shadow-none"
                       placeholder="Search here. . ." />
              </div>
            </form>
          </div>
        </li>
        <li class="pc-h-item d-none d-md-inline-flex">
          <form class="header-search">
            <i data-feather="search" class="icon-search"></i>
            <input type="search" class="form-control" placeholder="Search here. . ." />
          </form>
        </li>
      </ul>
    </div>
    <!-- [Mobile Media Block end] -->
    <div class="ms-auto">
      <ul class="list-unstyled">
        <li class="dropdown pc-h-item header-user-profile">
          <a class="pc-head-link dropdown-toggle arrow-none me-0"
             data-bs-toggle="dropdown"
             href="#"
             role="button"
             aria-haspopup="false"
             data-bs-auto-close="outside"
             aria-expanded="false">
            {% developer_avatar %}
            <span class="text-white">{{ request.user }}</span>
          </span>
        </a>
        <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown">
          <div class="dropdown-header">
            <div class="d-flex mb-1">
              <div class="flex-shrink-0">{% developer_avatar %}</div>
              <div class="flex-grow-1 ms-1">
                <h6 class="mb-1">{{ request.user }}</h6>
                <span>Developer</span>
              </div>
              <a href="{% url 'account_logout' %}" class="pc-head-link bg-transparent"><i class="ti ti-power text-danger"></i></a>
            </div>
          </div>
          <hr  class="my-3" />
          <div class="tab-content">
            <div class="tab-pane fade show active">
              <a href="{% url 'dashboard:users:detail' %}" class="dropdown-item"><i class="ti ti-user"></i> <span>Profile</span></a>
              <a href="#!" class="dropdown-item"><i class="ti ti-wallet"></i> <span>Billing</span></a>
              <a href="{% url 'account_logout' %}" class="dropdown-item"><i class="ti ti-power"></i> <span>Logout</span></a>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
</header>
