{% load static %}

<div class="modal fade modal-animate anim-super-scaled"
     id="editProjectPurchase"
     tabindex="-1"
     aria-modal="true"
     role="dialog"
     style="display: none">
  <div class="modal-dialog">
    <div class="modal-content">
      <form action="{% url 'dashboard:projects:project_purchase_update' project.uuid %}"
            method="post"
            class="project-form">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">{{ project.name|title }}: Project Update</h5>
          <button type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"></button>
        </div>
        <div class="modal-body">
          {% csrf_token %}
          {{ project_form.as_p }}
        </div>
        <div class="modal-footer">
          <button type="button"
                  class="btn btn-outline-secondary"
                  data-bs-dismiss="modal">cancel</button>
          <button type="submit" class="btn btn-primary shadow-2">Save Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
