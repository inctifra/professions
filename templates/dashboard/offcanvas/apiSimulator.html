
<div id="json-editor"></div>
<div class="offcanvas offcanvas-end" tabindex="-1" id="apiSimulator" aria-labelledby="apiSimulatorLabel" style="width: 800px;
  max-width: 100%;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="apiSimulatorLabel">API Call Simulator</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <form id="simulateApiForm">
      <div class="mb-3">
        <label class="form-label">Selected API Key</label>
        <input type="text" class="form-control" id="selectedApiKey" readonly />
      </div>
      <div class="mb-3">
    <label class="form-label">Resource</label>
    <select id="resource"></select>
</div>
      <div class="mb-3">
        <label class="form-label">Payload (JSON)</label>
        <div id="payloadEditor" style="height: 200px; border: 1px solid #ced4da; border-radius: 5px;"></div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Send Request</button>
    </form>
    <hr />
    <div id="apiResponse" class="mt-3"></div>
  </div>
</div>
